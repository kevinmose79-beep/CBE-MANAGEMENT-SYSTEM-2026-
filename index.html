    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
          (event.reason.message && typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')) ||
          (event.reason.toString && event.reason.toString().includes('WebSocket'))
        )) {
          event.preventDefault();
        }
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
